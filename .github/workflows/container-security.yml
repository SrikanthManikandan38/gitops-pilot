name: Build and scan container
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
  packages: write
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag ghcr.io/${{ github.repository_owner }}/gitops-pilot:latest .
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gitops-pilot:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/gitops-pilot:latest
