grafana:
  adminPassword: CHANGE_ME_BEFORE_INSTALLING
  service:
    type: LoadBalancer
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
