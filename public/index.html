<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitOps Pilot</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="logo">◆</span><strong>GitOps Pilot</strong></div><span class="connected">● Control plane connected</span></header>
<main><section class="hero"><div><p class="eyebrow">AUTOMATED DELIVERY</p><h1>Git is the source of truth.</h1><p>Observe environments, validate changes, and safely synchronize your clusters.</p></div><button id="refresh">Refresh status</button></section>
<section class="stats" id="stats"></section><section><div class="section-head"><h2>Environments</h2><span>Reconciliation is driven by declared state.</span></div><div id="environments" class="grid"></div></section>
<section class="activity"><h2>Recent activity</h2><div id="events"></div></section></main><template id="environment"><article class="card"><div class="card-title"><h3></h3><span class="badge"></span></div><dl><div><dt>Git branch</dt><dd class="branch"></dd></div><div><dt>Revision</dt><dd class="revision"></dd></div><div><dt>Policy</dt><dd class="policy"></dd></div></dl><footer><small class="updated"></small><button class="sync">Sync now</button></footer></article></template><script src="/app.js"></script></body></html>
